name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -v
      - name: Smoke test the CLI on sample logs
        run: |
          python -m sre_agent sample-logs/auth.log > /dev/null
          python -m sre_agent sample-logs/app.log > /dev/null
          python -m sre_agent sample-logs/auth.log sample-logs/app.log > /dev/null
